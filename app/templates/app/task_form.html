{% extends 'app/base.html' %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
    <h1>{{ heading }}</h1>

    <form method="post" class="card">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a class="btn btn-light" href="{% url 'app:task_list' %}">Cancel</a>
    </form>
{% endblock %}
